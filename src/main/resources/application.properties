spring.application.name=TTMS

# 服务启动基础配置
server.port=8080
server.servlet.session.timeout=30m
server.tomcat.uri-encoding=UTF-8

# Servlet / HTTP 编码配置
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JSON 时间与时区配置
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# 数据库配置说明：
# 1. 当前项目数据库连接仍由 src/main/resources/db-config.properties 读取
# 2. 启动前请先根据 db-config.properties.example 创建并修改 db-config.properties
# 3. 当前控制器已自带 /rest 前缀，因此这里不再额外配置 context-path
# 4. 本地默认访问路径示例：http://localhost:8080/rest
